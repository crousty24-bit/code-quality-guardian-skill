name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v

  package:
    name: Agent Skills package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@5d4c1fda3f786fff826c7f56b6cb3341e7f3a911#subdirectory=skills-ref"
      - name: Validate Agent Skills specification
        run: skills-ref validate skills/code-quality-guardian
      - name: Verify skills CLI discovery
        run: |
          npx --yes skills@1.5.10 add . --list --yes | tee /tmp/skills-list.txt
          grep -q "Found 1 skill" /tmp/skills-list.txt
          grep -q "code-quality-guardian" /tmp/skills-list.txt
      - name: Verify repository hygiene
        run: |
          test -z "$(git ls-files '*.pyc' '*__pycache__*')"
          test "$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test "$(find skills/code-quality-guardian/scripts -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 6
