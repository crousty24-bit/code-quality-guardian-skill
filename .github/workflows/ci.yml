name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v

  package:
    name: Agent Skills package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
      - name: Install Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@5d4c1fda3f786fff826c7f56b6cb3341e7f3a911#subdirectory=skills-ref"
      - name: Validate Agent Skills specification
        run: skills-ref validate skills/code-quality-guardian
      - name: Verify skills CLI discovery
        run: |
          npx --yes skills@1.5.10 add . --list --yes | tee /tmp/skills-list.txt
          python - <<'PY'
          import re
          from pathlib import Path

          output = Path("/tmp/skills-list.txt").read_text(encoding="utf-8")
          clean = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", output)
          assert "Found 1 skill" in clean
          assert "code-quality-guardian" in clean
          PY
      - name: Verify repository hygiene
        run: |
          test -z "$(git ls-files '*.pyc' '*__pycache__*')"
          test "$(find skills -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test "$(find skills/code-quality-guardian/scripts -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 7
